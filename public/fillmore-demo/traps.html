<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trap page · things that must not be saved (demo)</title>
<link rel="stylesheet" href="demo.css" />
<style>
  .row { display: flex; gap: 24px; align-items: flex-start; }
  .panel { width: 520px; height: 360px; overflow: auto; border: 1px solid #ccc; padding: 16px; position: relative; background: #fff; }
  .panel label { display: block; margin-bottom: 12px; }
  .hp { position: absolute; left: -9999px; }
</style>
</head>
<body>
<div class="demo-flag">DEMO TRAPS for testing Fillmore: a search box, a reading link, a pre-filled field, a mid-form success message and an off-screen honeypot.</div>
<main class="wrap">
  <form id="search" role="search"><label>Search the site <input name="q" /></label></form>
  <p><a href="https://example.com/article" id="read">Continue reading</a></p>
  <div class="row">
    <form id="app" class="panel" novalidate>
      <label>Full name <input name="fullname" /></label>
      <label>Email address <input name="email" type="email" /></label>
      <label>Email <input name="email_confirm_hp" class="hp" tabindex="-1" autocomplete="off" /></label>
      <label>City <input name="city" value="Springfield" /></label>
      <button type="button" id="otp">Send OTP</button>
      <p id="otp-status"></p>
      <label>Notes <textarea name="notes"></textarea></label>
      <button type="submit" id="go">Submit application</button>
    </form>
  </div>
</main>
<script>
  window.__sent = 0;
  document.getElementById("search").addEventListener("submit", (e) => e.preventDefault());
  document.getElementById("read").addEventListener("click", (e) => e.preventDefault());
  document.getElementById("otp").addEventListener("click", () => (document.getElementById("otp-status").textContent = "OTP sent successfully"));
  document.getElementById("app").addEventListener("submit", (e) => { e.preventDefault(); window.__sent++; });
</script>
</body>
</html>
